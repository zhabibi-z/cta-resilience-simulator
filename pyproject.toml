[project]
name = "cta-resilience-simulator"
version = "0.2.0"
description = "Multi-modal resilience decision-support simulator for the Chicago Transit Authority network"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
